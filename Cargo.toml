[package]
name = "donkey"
version = "0.2.16"
edition = "2024"
rust-version = "1.94"
description = "Multi-source OCI registry accelerator and cache"
license = "MIT"
repository = "https://github.com/ca-x/donkey"

[dependencies]
anyhow = "1.0"
backoff = { version = "0.4.0", features = ["futures", "tokio"] }
aes-gcm = "0.10"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["http1", "http2", "json", "macros", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
constant_time_eq = "0.4"
cron = "0.17.0"
dashmap = "6.1"
futures-util = "0.3"
hex = "0.4"
http = "1.3"
http-content-range = "0.2.5"
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
humantime = "2.2"
ipnet = "2.12.1"
moka = { version = "0.12.16", features = ["future"] }
oci-client = { version = "0.17.0", default-features = false, features = ["rustls-tls"] }
oci-spec-builder = { package = "oci-spec", version = "0.6.4", features = ["image"] }
oci-tar-builder = "0.4.0"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "gzip", "http2", "json", "rustls", "stream"] }
rust-embed = "8.12.0"
sea-orm = { version = "2.0.2", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-chrono", "with-uuid"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "limit", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
www_authenticate_parser = "1.0.2"

[target.'cfg(unix)'.dependencies]
ocirender = "0.2.2"

[dev-dependencies]
httpmock = "0.8"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
