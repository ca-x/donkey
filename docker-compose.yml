services:
  donkey:
    build: .
    image: ghcr.io/ca-x/donkey:latest
    container_name: donkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:5003:5003"
      - "5443:5443"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DONKEY_INITIAL_ADMIN_USERNAME: ${DONKEY_INITIAL_ADMIN_USERNAME:?set DONKEY_INITIAL_ADMIN_USERNAME in .env}
      DONKEY_INITIAL_ADMIN_PASSWORD: ${DONKEY_INITIAL_ADMIN_PASSWORD:?set DONKEY_INITIAL_ADMIN_PASSWORD in .env}
      DONKEY_SESSION_TTL: ${DONKEY_SESSION_TTL:-7d}
      DONKEY_ADMIN_AUTH: ${DONKEY_ADMIN_AUTH:-}
      DONKEY_ADMIN_EXTERNAL_TLS: ${DONKEY_ADMIN_EXTERNAL_TLS:-false}
      # Safe only because ports binds 5003 to 127.0.0.1 above.
      DONKEY_ADMIN_EXTERNAL_LOOPBACK: "true"
      DONKEY_OIDC_ISSUER: ${DONKEY_OIDC_ISSUER:-}
      DONKEY_OIDC_CLIENT_ID: ${DONKEY_OIDC_CLIENT_ID:-}
      DONKEY_OIDC_CLIENT_SECRET: ${DONKEY_OIDC_CLIENT_SECRET:-}
      DONKEY_OIDC_REDIRECT_URL: ${DONKEY_OIDC_REDIRECT_URL:-}
      DONKEY_OIDC_DISPLAY_NAME: ${DONKEY_OIDC_DISPLAY_NAME:-Single sign-on}
      DONKEY_REGISTRY_AUTH: ${DONKEY_REGISTRY_AUTH:-}
      DONKEY_REGISTRY_EXTERNAL_TLS: ${DONKEY_REGISTRY_EXTERNAL_TLS:-false}
      DONKEY_PROXY_AUTH: ${DONKEY_PROXY_AUTH:-}
      DONKEY_CONNECT_ALLOW: ${DONKEY_CONNECT_ALLOW:-}
      DONKEY_CONNECT_REMAP: ${DONKEY_CONNECT_REMAP:-}
      DONKEY_CREDENTIAL_KEY: ${DONKEY_CREDENTIAL_KEY:-}
      DONKEY_MAX_CACHE_BYTES: ${DONKEY_MAX_CACHE_BYTES:-53687091200}
      DONKEY_MAX_EXPORT_BYTES: ${DONKEY_MAX_EXPORT_BYTES:-21474836480}
      DONKEY_EXPORT_TTL: ${DONKEY_EXPORT_TTL:-7d}
      DONKEY_SCHEDULER_POLICY: ${DONKEY_SCHEDULER_POLICY:-balanced}
      DONKEY_CACHE_POLICY: ${DONKEY_CACHE_POLICY:-balanced}
      DONKEY_CACHE_HIGH_WATERMARK: ${DONKEY_CACHE_HIGH_WATERMARK:-0.90}
      DONKEY_CACHE_LOW_WATERMARK: ${DONKEY_CACHE_LOW_WATERMARK:-0.80}
      DONKEY_CACHE_TTL: ${DONKEY_CACHE_TTL:-}
      DONKEY_TLS_CERT: ${DONKEY_TLS_CERT:-}
      DONKEY_TLS_KEY: ${DONKEY_TLS_KEY:-}
    volumes:
      - donkey-data:/data
      - ./certs:/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  donkey-data:
